<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1180" viewBox="0 0 960 1180" role="img" aria-labelledby="title desc">
  <title id="title">Kova architecture layers</title>
  <desc id="desc">A vertical diagram from an external project through public APIs, foundation, domains, plugins, runtime, and backends.</desc>
  <rect width="960" height="1180" fill="#111827"/>
  <style>
    .box { fill:#1f2937; stroke:#4b5563; stroke-width:2; }
    .accent { fill:#202a52; stroke:#7182e5; stroke-width:2; }
    .title { fill:#f9fafb; font:700 27px Arial,sans-serif; }
    .text { fill:#cbd5e1; font:20px Arial,sans-serif; }
    .arrow { stroke:#9ca3af; stroke-width:4; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="480" y="58" text-anchor="middle" class="title">External game or validation project</text>
  <line x1="480" y1="80" x2="480" y2="122" class="arrow"/>
  <rect x="130" y="140" width="700" height="120" rx="18" class="accent"/>
  <text x="480" y="187" text-anchor="middle" class="title">Public facade and desktop composition</text>
  <text x="480" y="224" text-anchor="middle" class="text">kova_desktop, KovaApp, plugin groups</text>
  <line x1="480" y1="262" x2="480" y2="304" class="arrow"/>
  <rect x="130" y="322" width="700" height="120" rx="18" class="box"/>
  <text x="480" y="369" text-anchor="middle" class="title">Foundation</text>
  <text x="480" y="406" text-anchor="middle" class="text">core, ECS, app, math, tasks, fs</text>
  <line x1="480" y1="444" x2="480" y2="486" class="arrow"/>
  <rect x="130" y="504" width="700" height="148" rx="18" class="box"/>
  <text x="480" y="551" text-anchor="middle" class="title">Backend-neutral domains</text>
  <text x="480" y="589" text-anchor="middle" class="text">assets, scene, transform, input, camera</text>
  <text x="480" y="622" text-anchor="middle" class="text">mesh, material, physics, diagnostics</text>
  <line x1="480" y1="654" x2="480" y2="696" class="arrow"/>
  <rect x="130" y="714" width="700" height="120" rx="18" class="box"/>
  <text x="480" y="761" text-anchor="middle" class="title">Plugins and render pipeline boundaries</text>
  <text x="480" y="798" text-anchor="middle" class="text">public contracts, extraction, planning</text>
  <line x1="480" y1="836" x2="480" y2="878" class="arrow"/>
  <rect x="130" y="896" width="700" height="120" rx="18" class="box"/>
  <text x="480" y="943" text-anchor="middle" class="title">Runtime and runners</text>
  <text x="480" y="980" text-anchor="middle" class="text">desktop composition, window/render loop</text>
  <line x1="480" y1="1018" x2="480" y2="1060" class="arrow"/>
  <rect x="130" y="1078" width="700" height="82" rx="18" class="accent"/>
  <text x="480" y="1128" text-anchor="middle" class="title">WGPU, winit, platform integration</text>
</svg>
